<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- CredCheck favicon: the HUD panel + terminal prompt, in miniature -->
  <rect width="64" height="64" rx="10" fill="#05070a"/>
  <!-- corner brackets -->
  <path d="M12 20 V12 H20" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="square"/>
  <path d="M44 12 H52 V20" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="square"/>
  <path d="M52 44 V52 H44" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="square"/>
  <path d="M20 52 H12 V44" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="square"/>
  <!-- prompt chevron + cursor -->
  <path d="M22 24 L32 32 L22 40" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="36" y="36" width="10" height="5" fill="#4ade80"/>
</svg>
