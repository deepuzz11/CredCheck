services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: credcheck
      POSTGRES_PASSWORD: credcheck
      POSTGRES_DB: credcheck
    ports:
      - "5432:5432"
    volumes:
      - credcheck-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  credcheck-db:
